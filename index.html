<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Visual Reactive Engine</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #webgl {
        display: block;
        width: 100%;
        height: 100%;
      }
      #frame {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        aspect-ratio: 9 / 16;
        height: min(100vh, 177.78vw); /* 16/9 = 1.777... */
        width: auto;
        max-width: 100vw;
        box-sizing: border-box;
        border: 2px solid rgba(0, 229, 255, 0.35);
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="webgl"></canvas>
      <div id="overlay"></div>
      <div id="frame"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
