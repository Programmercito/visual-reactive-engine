<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Visual Reactive Engine</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #webgl {
        display: block;
        width: 100%;
        height: 100%;
      }
      #frame {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        aspect-ratio: 9 / 16;
        height: min(100vh, 177.78vw); /* 16/9 = 1.777... */
        width: auto;
        max-width: 100vw;
        box-sizing: border-box;
        border: 2px solid rgba(0, 229, 255, 0.35);
        pointer-events: none;
        z-index: 10;
      }
      #speech-toggle {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 20;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 10px 14px;
        color: #fff;
        background: rgba(0, 0, 0, 0.72);
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
      #speech-toggle:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="webgl"></canvas>
      <div id="overlay"></div>
      <div id="frame"></div>
      <button id="speech-toggle" type="button" aria-pressed="false">🔇 Activar voz</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
